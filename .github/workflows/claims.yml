name: claims

# A number may not appear in our published prose unless a committed script
# produces it. This is the gate that enforces that. It exists because the
# corpus-size correlation was published as r = -0.12 with its specification
# living in a chat session, where nobody could check it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"   # Mondays, so drift on the live pages surfaces weekly

jobs:
  figures-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Committed scorer outputs still match their scripts
        run: python3 verify/figures.py --check-fresh
      - name: Every figure recomputes
        run: python3 verify/figures.py > /dev/null
      - name: The pinned corpus-size specification reproduces
        run: python3 paper/corpus_size.py --sensitivity

  # Every verify/test_*.py, discovered rather than listed: a test file that nobody
  # runs is worse than no test, because it reads as cover. Two of these existed
  # for a day before anything executed them in CI.
  scorer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run every verify/test_*.py
        run: |
          set -e
          found=0
          for t in verify/test_*.py; do
            [ -e "$t" ] || continue
            found=$((found+1))
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no verify/test_*.py found — the glob or the files moved"
            exit 1
          fi
          echo "$found test file(s) passed"

  claims-are-backed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Local surfaces (paper, dataset card, findings)
        run: python3 verify/check_claims.py --offline
      - name: Published pages
        run: python3 verify/check_claims.py
        continue-on-error: false

  licence-drift:
    # Reports, never blocks. A licence audit is a point-in-time statement; the
    # job of this check is to make sure a re-review never goes unnoticed again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Licence figures reproduce from the snapshot
        run: python3 verify/licences.py
